name: RainWrt source audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git shellcheck
      - name: Source safety tests
        run: |
          python3 tests/test_local_bdf.py
          python3 tests/test_prepare_rainwrt_build.py
          python3 tests/test_hardware_runner.py
          sh tests/mi_layout_test.sh
          sh tests/mi_dualboot_test.sh
          sh tests/platform_write_scope_test.sh
          sh tests/attended_install_state_test.sh
          shellcheck scripts/build-rainwrt.sh scripts/audit-public-release.sh
      - name: Audit public-source refs
        run: python3 scripts/audit_public_source.py --ref HEAD

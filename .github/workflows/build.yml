name: Build RainWrt AX3000

on:
  workflow_dispatch:
  push:
    branches: [rainwrt/immortalwrt-25.12, main]
    paths-ignore: ['docs/**']

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget shellcheck fakeroot kmod
      - name: Offline safety tests
        run: |
          python3 tests/test_hardware_runner.py
          sh tests/mi_layout_test.sh
          sh tests/mi_dualboot_test.sh
          sh tests/platform_write_scope_test.sh
          sh tests/attended_install_state_test.sh
          shellcheck scripts/attended-cr8808-hardware-test.sh scripts/lib/cr8808-probe.sh scripts/performance-audit.sh scripts/build-rainwrt.sh scripts/audit-public-release.sh
          sh scripts/audit-public-release.sh
      - name: Build
        run: JOBS=4 sh scripts/build-rainwrt.sh
      - name: Verify and checksum
        run: |
          target=bin/targets/qualcommax/ipq50xx
          test -d "$target/packages"
          grep -q '^kmod-wireguard ' "$target"/*.manifest
          grep -q '^wireguard-tools ' "$target"/*.manifest
          grep -q '^luci-proto-wireguard ' "$target"/*.manifest
          grep -q '^wpad-openssl ' "$target"/*.manifest
          cp rainwrt-build-identity.json "$target/"
          cp files/etc/rainwrt-release "$target/"
          checksum_tmp="$(mktemp)"
          (cd "$target" && \
            find . -type f ! -name SHA256SUMS -print0 | \
            LC_ALL=C sort -z | xargs -0 sha256sum) > "$checksum_tmp"
          mv "$checksum_tmp" "$target/SHA256SUMS"
      - name: Inspect exact images and APK closure
        run: |
          python3 scripts/package-hwtest.py --build-root "$PWD" --output "$RUNNER_TEMP/rainwrt-candidate"
          python3 scripts/audit-candidate.py --build-root "$PWD" --candidate "$RUNNER_TEMP/rainwrt-candidate"
          sh scripts/audit-public-release.sh --rootfs "$RUNNER_TEMP/rainwrt-candidate/static-inspection/rootfs"
      - name: Upload firmware and ABI-matched package feed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rainwrt-redmi-ax3000-${{ github.sha }}
          path: |
            bin/targets/qualcommax/ipq50xx/
            bin/packages/aarch64_cortex-a53/
          if-no-files-found: error
          retention-days: 90
